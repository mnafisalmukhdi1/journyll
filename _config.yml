# ====== Konfigurasi Portal Multi-Jurnal ======
title: Portal Jurnal
description: Portal jurnal ilmiah akses terbuka
lang: id

# GitHub Pages:
#  - Situs pengguna (username.github.io)    -> baseurl: ""
#  - Situs proyek (username.github.io/repo) -> baseurl: "/repo"
url: "https://username.github.io"
baseurl: ""

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  articles:
    output: true
    permalink: /artikel/:path/   # contoh: /artikel/jurnal-a/judul-artikel/

defaults:
  - scope: { path: "", type: "articles" }
    values: { layout: article }

exclude: [README.md, Gemfile, Gemfile.lock, vendor, node_modules, tools]
