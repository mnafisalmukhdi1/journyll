<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.data.journal.name }}</title>
  <meta name="description" content="{{ page.abstract | default: site.description | strip_newlines | truncate: 160 | escape }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% if page.layout == "article" %}
  <!-- Metadata Google Scholar -->
  <meta name="citation_title" content="{{ page.title | escape }}">
  {% for a in page.authors %}<meta name="citation_author" content="{{ a.name | escape }}">
  {% endfor %}<meta name="citation_publication_date" content="{{ page.year }}">
  <meta name="citation_journal_title" content="{{ site.data.journal.name | escape }}">
  <meta name="citation_volume" content="{{ page.volume }}">
  <meta name="citation_issue" content="{{ page.number }}">
  {% if page.doi %}<meta name="citation_doi" content="{{ page.doi }}">{% endif %}
  {% if page.pdf %}<meta name="citation_pdf_url" content="{{ page.pdf | absolute_url }}">{% endif %}
  {% endif %}
</head>
