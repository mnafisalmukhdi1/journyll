<header class="masthead">
  <div class="container py-4">
    <a class="masthead-title" href="{{ '/' | relative_url }}">{{ site.data.journal.name }}</a>
    <p class="mb-0 masthead-sub">{{ site.data.journal.tagline }}</p>
    <p class="mb-0 small masthead-issn">p-ISSN {{ site.data.journal.issn_print }} &nbsp;|&nbsp; e-ISSN {{ site.data.journal.issn_online }}</p>
  </div>
</header>
